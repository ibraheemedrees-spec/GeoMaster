name: Flutter CI Signed

on:
  push:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  build-signed-aab:
    name: Build Signed AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create platforms
        run: flutter create . --project-name geo_master --org com.geomaster.app

      - name: Fix test & assets
        run: |
          mkdir -p test assets/images
          touch assets/images/.gitkeep
          echo "import 'package:flutter_test/flutter_test.dart'; void main(){test('ok',()=>expect(1,1));}" > test/widget_test.dart

      - name: Android permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if [ -f "$M" ]; then
            grep -q BLUETOOTH_SCAN "$M" || sed -i 's|</manifest>|<uses-permission android:name="android.permission.BLUETOOTH"/>\n<uses-permission android:name="android.permission.BLUETOOTH_ADMIN"/>\n<uses-permission android:name="android.permission.BLUETOOTH_SCAN"/>\n<uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n<uses-permission android:name="android.permission.INTERNET"/>\n</manifest>|' "$M"
          fi

      - run: flutter pub get

      - name: Patch compileSdk
        run: |
          find "$HOME/.pub-cache" -name "build.gradle" -type f 2>/dev/null | while read f; do
            sed -i 's/flutter\.compileSdkVersion/35/g' "$f" || true
            sed -i 's/flutter\.minSdkVersion/24/g' "$f" || true
          done
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            [ -f "$f" ] || continue
            sed -i 's/compileSdk.*/compileSdk 35/' "$f" 2>/dev/null || true
            sed -i 's/compileSdk = .*/compileSdk = 35/' "$f" 2>/dev/null || true
            sed -i 's/minSdk.*/minSdk 24/' "$f" 2>/dev/null || true
            sed -i 's/minSdk = .*/minSdk = 24/' "$f" 2>/dev/null || true
          done

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          ls -la android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Inject signing into build.gradle / build.gradle.kts
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            # Prefer rewriting a clean signing section via a helper script
            python3 << 'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          text = p.read_text()
          header = '''
          import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''
          if "keystoreProperties" not in text:
              text = header + text
          # storeFile is relative to android/app/
          if "signingConfigs" not in text:
              text = text.replace(
                  "buildTypes {",
                  '''signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
              buildTypes {'''
              )
          if 'signingConfig = signingConfigs.getByName("release")' not in text:
              text = text.replace(
                  'getByName("release") {',
                  'getByName("release") {\n            signingConfig = signingConfigs.getByName("release")'
              )
          # key.properties path: storeFile=upload-keystore.jks is relative to app/
          # but key.properties is in android/ — fix storeFile path in properties for kts
          p.write_text(text)
          print("kts patched")
          PY
            # For kts, storeFile relative to android/app → file is already in app/
            sed -i 's|storeFile=.*|storeFile=upload-keystore.jks|' android/key.properties
          fi

          if [ -f android/app/build.gradle ]; then
            python3 << 'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          text = p.read_text()
          header = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          '''
          if "keystoreProperties" not in text:
              text = header + text
          if "signingConfigs" not in text:
              text = text.replace(
                  "buildTypes {",
                  '''signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
              buildTypes {'''
              )
          if "signingConfig signingConfigs.release" not in text:
              text = text.replace(
                  "release {",
                  "release {\n            signingConfig signingConfigs.release",
                  1,
              )
          p.write_text(text)
          # Groovy file() in app/build.gradle is relative to android/app/
          # key.properties is at android/key.properties with storeFile=upload-keystore.jks
          # but file() looks relative to app/ — put path as upload-keystore.jks and file is in app/
          print("groovy patched")
          PY
            # Copy keystore ref: properties storeFile relative to android/ when using rootProject
            # Actually in app/build.gradle, file(x) is relative to app/ module dir
            sed -i 's|storeFile=.*|storeFile=upload-keystore.jks|' android/key.properties
          fi

      - name: Build signed AAB
        run: flutter build appbundle --release
        timeout-minutes: 30

      - name: Build signed APK
        run: flutter build apk --release
        timeout-minutes: 30
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: geo-master-aab-signed
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 30
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: geo-master-apk-signed
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: warn
