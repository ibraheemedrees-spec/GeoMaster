name: geo_master
description: Geo Master - Professional Surveying App
publish_to: 'none'
version: 1.5.1+5

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  # OpenStreetMap - no API key needed
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^11.1.0
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.7
  intl: any
  uuid: ^4.4.2
  equatable: ^2.0.5
  csv: ^6.0.0
  share_plus: ^9.0.0
  path: ^1.9.0
  flutter_blue_plus: ^1.32.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
