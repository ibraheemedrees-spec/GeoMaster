name: geo_master
description: Geo Master - Professional Surveying App with Base/Rover & External GNSS support
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  google_maps_flutter: ^2.9.0
  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.7
  intl: any
  uuid: ^4.4.2
  equatable: ^2.0.5
  csv: ^6.0.0
  share_plus: ^9.0.0
  path: ^1.9.0
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.2.0
  firebase_storage: ^12.1.1
  flutter_blue_plus: ^1.32.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/translations/
